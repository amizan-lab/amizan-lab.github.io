<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>編み算｜編み物のための計算ツール</title>
<meta name="description" content="編み物のための計算ツール「編み算」。スマホで見やすい大きな文字で、毛糸の必要玉数などを計算できます。">
<style>
  :root { color-scheme: light; --y:#ffe600; --ink:#111111; --paper:#ffffff; --sub:#555555; --card:#f2f2f2; --yw:clamp(50px,15vw,66px); --fs:clamp(38px,13vw,54px); }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--paper); color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic",sans-serif;
    font-size:18px; line-height:1.7; }
  main { max-width:560px; margin:0 auto; padding:18px 16px 48px; }
  header { padding:12px 0 30px; border-bottom:1px solid var(--ink); margin-bottom:30px; }
  .row { display:flex; align-items:flex-end; gap:12px; }
  .yarn { flex:none; width:var(--yw); height:auto; overflow:visible; margin-bottom:calc((var(--fs) * 1.2 - var(--yw)) / 2); }
  .name-wrap { display:flex; align-items:flex-end; gap:12px; min-width:0; }
  h1 { margin:0; line-height:1.2; white-space:nowrap; font-size:var(--fs); font-weight:300; letter-spacing:.16em; }
  .en { font-family:-apple-system,"Helvetica Neue",Arial,sans-serif; font-size:12px; font-weight:600; letter-spacing:.3em; color:var(--sub); margin:0 0 calc(var(--fs) * .12); white-space:nowrap; }
  .tag { display:inline-block; margin:0 0 10px; background:#333; color:#fff; font-size:13px; font-weight:700; letter-spacing:.1em; padding:1px 10px; }
  @media (max-width: 340px) { .en { display:none; } }
  h2 { display:inline-block; background:var(--y); padding:0 12px; font-size:15px; font-weight:700; letter-spacing:.2em; color:var(--ink); margin:0 0 16px; }
  .tool { display:block; position:relative; text-decoration:none; color:var(--ink); background:var(--card);
    border-left:10px solid var(--ink); padding:16px 14px 16px 16px; }
  .tool + .tool { margin-top:16px; }
  .tool:active { background:#e6e6e6; }
  .tool:focus-visible { outline:4px solid var(--y); outline-offset:3px; }
  .tool .name { display:block; font-size:clamp(18px,5.6vw,21px); font-weight:900; line-height:1.4; }
  .tool .desc { display:block; font-size:16px; color:#333; margin-top:6px; padding-right:52px; }
  .go { position:absolute; right:12px; bottom:12px; background:var(--ink); color:#fff; display:flex; align-items:center; justify-content:center; font-weight:800; }
  .go { width:34px; height:34px; font-size:18px; }
  .note { display:flex; justify-content:space-between; align-items:center; gap:12px; text-decoration:none; color:var(--ink);
    background:var(--card); border-left:10px solid var(--y); margin-top:34px; padding:12px 16px; font-size:16px; }
  .note b { white-space:nowrap; }
  .note:active { background:#e6e6e6; }
  .note:focus-visible { outline:4px solid var(--y); outline-offset:3px; }
  .fine { font-size:13px; line-height:1.7; color:var(--sub); margin:30px 2px 0; }
</style>
</head>
<body>
<main>
  <header>
    <p class="tag">編み物のための計算ツール</p>
    <div class="row"><svg class="yarn" viewBox="0 0 80 80" aria-hidden="true"><circle cx="38" cy="38" r="30" fill="#ffe600"/><g fill="none" stroke="#111" stroke-width="2" stroke-linecap="round"><path d="M13 33 Q26 19 47 15"/><path d="M17 45 Q30 29 56 25"/><path d="M21 57 Q34 41 60 37"/></g><circle cx="38" cy="38" r="30" fill="none" stroke="#111" stroke-width="2.4"/><path d="M59 59 C66 66, 60 76, 74 76" fill="none" stroke="#111" stroke-width="2.4" stroke-linecap="round"/></svg><div class="name-wrap"><h1>編み算</h1><p class="en">AMIZAN</p></div></div>
  </header>

  <h2>ツール</h2>
  <a class="tool" href="amizan_nantama.html">
    <span class="name">この糸なら何玉で編める？</span>
    <span class="desc">編み図の糸と違う糸を使うときの、必要な玉数を計算します。</span>
    <span class="go" aria-hidden="true">→</span>
  </a>
  <a class="tool" href="amizan_gauge.html">
    <span class="name">このまま編んだらどうなる？</span>
    <span class="desc">編み図とゲージが違うとき、そのまま編むと完成サイズがどう変わるかを計算します。</span>
    <span class="go" aria-hidden="true">→</span>
  </a>
  <a class="tool" href="amizan_increase.html">
    <span class="name">増し目の編み図メーカー</span>
    <span class="desc">「4-1-6」のような増し目の指示から、編み図を作成します。</span>
    <span class="go" aria-hidden="true">→</span>
  </a>

  <a class="note" href="https://note.com/amizan" target="_blank" rel="noopener">
    <span>制作の記録は note で</span><b>読む →</b>
  </a>

  <p class="fine">各ツールの計算結果は目安です。実際に必要な量は、糸の状態や編み地によって変わります。</p>
</main>
</body>
</html>
